# Auto-Claude Agent API - Enclii Service Specification
# Headless REST API for the Auto-Claude autonomous coding framework

apiVersion: enclii.dev/v1alpha
kind: Service
metadata:
  name: auto-claude-api
  project: madfam-automation
spec:
  build:
    type: dockerfile
    dockerfile: apps/backend/Dockerfile
  runtime:
    port: 8080
    replicas: 1
    healthCheck: /health
  env:
    # Janua OAuth2 / JWT Configuration
    - name: JANUA_URL
      value: "https://auth.madfam.io"
    - name: JANUA_JWKS_URL
      value: "https://auth.madfam.io/.well-known/jwks.json"
    # Application Settings
    - name: PYTHONUNBUFFERED
      value: "1"
    - name: WORKSPACE_BASE_DIR
      value: "/tmp/auto-claude"
    - name: ENV
      value: "production"
    # Claude Agent SDK Settings
    - name: GRAPHITI_ENABLED
      value: "false"
    - name: LINEAR_MCP_ENABLED
      value: "false"
    - name: CONTEXT7_ENABLED
      value: "true"
  volumes:
    - name: workspace-data
      mountPath: /tmp/auto-claude
      size: 10Gi
